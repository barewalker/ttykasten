# ttykasten config file. Put it at ~/.config/ttykasten/config.toml
# ($TTYKASTEN_CONFIG or $XDG_CONFIG_HOME change the location).
#
# It is read on every start, so edits take effect at once (no rebuild).
# Anything left out takes the default shown here. The defaults are
# fzfkasten.nvim's, so to use one collection from both tools, write the same
# values as in your Neovim setup(). An unknown key is reported (so typos show
# up) and ignored, so a config newer than the binary still loads.

# Language of messages: "en" or "ja". Day and month names written into notes
# (%A, %B) are always English.
language = "en"

# Where the notes live. Unset: $ZETTELKASTEN_HOME, else ~/notes.
# $TTYKASTEN_HOME, when set, overrides everything (handy for trying things out).
# home = "~/zettelkasten"

extension = "md"

# strftime format of {{hdate}}.
hdate_format = "%B %d, %Y"

# Template for new notes (inside home/templates/). Unset: just "# Title".
# new_note_template = "templates/template_new_note.md"

# Editor that opens notes. Unset: $EDITOR, else nvim.
# editor = "nvim"

# Editor argument that opens a file at a line ({line} is replaced), used by
# `backlinks`. "" opens files at the top.
editor_line = "+{line}"

# Where `link` and `link-daily` copy the link: "osc52" (the terminal's
# clipboard; also works over ssh and mosh, and in tmux with set-clipboard on),
# "none", or a command that reads the link on stdin, e.g. "wl-copy".
clipboard = "osc52"

[notes.daily]
dir = "daily"
format = "%Y-%m-%d"
template = "daily.md"
lookback_days = 30      # days listed by `log`

[notes.weekly]
dir = "weekly"
format = "%G-W%V"       # %G is the ISO week-based year
template = "weekly.md"
lookback_weeks = 8      # weeks listed by `log`

[tasks]
# Tag added to captured tasks (without the #). Unset: no tag is added.
# require_tag = "todo"
# Where tasks are captured. Unset: the first entry of `always`. With neither,
# `capture` refuses.
# capture_note = "tasks/active.md"
always = []
new_checkbox = "- [ ] "
# "all": any line outside frontmatter, fences and headings can hold a task.
# "headings": only lines under a heading matching one of `headings` (regexes
# on the heading's trimmed, lowercased text).
scope = "all"
headings = ['^tasks?([^A-Za-z]|$)', '^to-?dos?([^A-Za-z]|$)', '^タスク', '^やること']
# Untagged checkboxes (the inbox) in notes older than this many days are left
# out. Unset: no limit. Tagged tasks never age out, nor do notes in `always`.
# since_days = 60
# How a note is dated: first `date_patterns` (regexes tried on its first
# `date_lines` lines; the first YYYY-MM-DD in the match, or in its first group,
# counts), then the first YYYY-MM-DD in the file name, then these frontmatter
# keys. The plugin's `tasks.date` hook is a Lua function; this is its
# counterpart. Example: date_patterns = ['^\*\*Created\*\*:\s*(\d{4}-\d{2}-\d{2})']
date_patterns = []
date_lines = 10
date_keys = ["date", "created"]
sort = "priority"       # the task list's order: "priority", "due" or "added"

[tasks.ignore]
frontmatter_key = "tasks"   # `tasks: false` (or no / off) opts a note out
dirs = ["templates"]

# Keys in `tasks` and `inbox` (fzf key names; "" unbinds one).
[tasks.keys]
done = "ctrl-x"         # done <-> open
cancel = "ctrl-d"       # cancel <-> reopen
tag = "ctrl-t"          # add require_tag (useful in the inbox)
due = "alt-l"           # set the due date; blank clears
capture = "alt-a"       # capture with tags and a due date
undo = "alt-u"
sort = "alt-s"          # priority -> due -> added
closed = "alt-x"        # also show done and cancelled tasks

[block_id]
length = 6
alphabet = "abcdefghijklmnopqrstuvwxyz0123456789"
on_capture = false      # give captured tasks a ^id
on_tag = false          # give lines that `tag` turns into tasks a ^id
daily_bullet = "- "     # written before the link that `link-daily` adds
alias = false           # link as [[note#^id|text of the line]]
alias_max = 40          # cut the alias to this many characters; 0 = whole

[log]
day_label = "%Y-%m-%d (%a)"
week_label = "%G-W%V"

[fzf]
command = "fzf"
opts = []               # extra arguments for every fzf, e.g. ["--border", "--height=60%"]
preview = true          # show the note next to the list

# Colours are SGR parameters ("1;34" is bold blue). "" turns colouring off.
[preview.colors]
heading = "1;34"
tag = "36"
link = "4;34"
open = "33"
done = "32"
priority = "1;33"
due = "31"
dim = "2"
cancelled = "2;9"
mark = "7"              # the picked line in `link` and `backlinks`

# The menu shown when ttykasten runs with no arguments. Unset: every action,
# in the default order. Set: only the items written, in the order written.
#   action   a ttykasten action: daily weekly capture tasks inbox
#            capture-guided tag mint-ids undo find new log link link-daily
#            backlinks
#   command  a shell command to run instead (sh -c, in home)
#   key      a hint shown in the list; `ttykasten <key>` also runs the item
#   label    the description; unset uses the language's default
#
# [[menu.items]]
# action = "daily"
# key = "kd"
#
# [[menu.items]]
# label = "git status"
# command = "git status; read -r _"

# ttykasten config file. Put it at ~/.config/ttykasten/config.toml
# ($TTYKASTEN_CONFIG or $XDG_CONFIG_HOME change the location).
#
# It is read on every start, so edits take effect at once (no rebuild).
# Anything left out takes the default shown here. The defaults are
# fzfkasten.nvim's, so to use one collection from both tools, write the same
# values as in your Neovim setup(). An unknown key is reported (so typos show
# up) and ignored, so a config newer than the binary still loads.

# Language of messages: "en" or "ja". Day and month names written into notes
# (%A, %B) are always English.
language = "en"

# Where the notes live. Unset: $ZETTELKASTEN_HOME, else ~/notes.
# $TTYKASTEN_HOME, when set, overrides everything (handy for trying things out).
# home = "~/zettelkasten"

extension = "md"

# strftime format of {{hdate}}.
hdate_format = "%B %d, %Y"

# Template for new notes (inside home/templates/). Unset: just "# Title".
# new_note_template = "templates/template_new_note.md"

# Ask which template a new note uses (the default listed first; Esc takes
# new_note_template), as the plugin does.
pick_template = true

# Editor that opens notes. Unset: $EDITOR, else nvim.
# editor = "nvim"

# Editor argument that opens a file at a line ({line} is replaced), used by
# `backlinks`. "" opens files at the top.
editor_line = "+{line}"

# Neovim's swap directory. Before writing a note, ttykasten reads its swap
# file there and refuses when the note is open in a running Neovim with
# unsaved changes (writing would lose one side's edits on :w). Unset:
# Neovim's default, $XDG_STATE_HOME/nvim/swap or ~/.local/state/nvim/swap.
# "" turns the check off.
# nvim_swap_dir = "~/.local/state/nvim/swap"

# How `note` deletes a note: a command that moves its argument to the trash.
# Unset: `gio trash`, else `trash` (macOS). "" leaves none, so deleting is
# refused; ttykasten never unlinks a note itself.
# trash = "gio trash"

# The pager `digest` uses on a terminal (it gets coloured text). "" prints.
pager = "less -R"

# Where `link` and `link-daily` copy the link: "osc52" (the terminal's
# clipboard; also works over ssh and mosh, and in tmux with set-clipboard on),
# "none", or a command that reads the link on stdin, e.g. "wl-copy".
clipboard = "osc52"

# Following a [[link]] from an editor (`link-at`, gf in contrib/ttykasten.vim).
[follow_link]
create_nonexisting = false  # make the note when the link names none
# new_note_template = "templates/template_new_note.md"   # unset: new_note_template

[notes.daily]
dir = "daily"
format = "%Y-%m-%d"
template = "daily.md"
lookback_days = 30      # days listed by `log`

[notes.weekly]
dir = "weekly"
format = "%G-W%V"       # %G is the ISO week-based year
template = "weekly.md"
lookback_weeks = 8      # weeks listed by `log`

[tasks]
# Tag added to captured tasks (without the #). Unset: no tag is added.
# require_tag = "todo"
# Where tasks are captured. Unset: the first entry of `always`. With neither,
# `capture` refuses.
# capture_note = "tasks/active.md"
always = []
new_checkbox = "- [ ] "
# "all": any line outside frontmatter, fences and headings can hold a task.
# "headings": only lines under a heading matching one of `headings` (regexes
# on the heading's trimmed, lowercased text).
scope = "all"
headings = ['^tasks?([^A-Za-z]|$)', '^to-?dos?([^A-Za-z]|$)', '^タスク', '^やること']
# Untagged checkboxes (the inbox) in notes older than this many days are left
# out. Unset: no limit. Tagged tasks never age out, nor do notes in `always`.
# since_days = 60
# How a note is dated: first `date_patterns` (regexes tried on its first
# `date_lines` lines; the first YYYY-MM-DD in the match, or in its first group,
# counts), then the first YYYY-MM-DD in the file name, then these frontmatter
# keys. The plugin's `tasks.date` hook is a Lua function; this is its
# counterpart. Example: date_patterns = ['^\*\*Created\*\*:\s*(\d{4}-\d{2}-\d{2})']
date_patterns = []
date_lines = 10
date_keys = ["date", "created"]
sort = "priority"       # the task list's order: "priority", "due" or "added"

[tasks.ignore]
frontmatter_key = "tasks"   # `tasks: false` (or no / off) opts a note out
dirs = ["templates"]

# Keys in `tasks` and `inbox` (fzf key names; "" unbinds one).
[tasks.keys]
done = "ctrl-x"         # done <-> open
cancel = "ctrl-d"       # cancel <-> reopen
tag = "ctrl-t"          # add require_tag (useful in the inbox)
due = "alt-l"           # set the due date; blank clears
capture = "alt-a"       # capture with tags and a due date
undo = "alt-u"
sort = "alt-s"          # priority -> due -> added
reverse = "alt-r"       # turn the order round (the steps of a job stay in order)
closed = "alt-x"        # open -> done and cancelled too -> only those
filter_tag = "alt-t"    # keep one tag's tasks (a step of a tagged job counts)
filter_due = "alt-e"    # overdue -> due by today -> this week -> no due date -> off
group = "alt-g"         # by note -> by tag -> by due date -> flat

[block_id]
length = 6
alphabet = "abcdefghijklmnopqrstuvwxyz0123456789"
on_capture = false      # give captured tasks a ^id
on_tag = false          # give lines that `tag` turns into tasks a ^id
daily_bullet = "- "     # written before the link that `link-daily` adds
alias = false           # link as [[note#^id|text of the line]]
alias_max = 40          # cut the alias to this many characters; 0 = whole

[log]
day_label = "%Y-%m-%d (%a)"
week_label = "%G-W%V"
date_key = "ctrl-x"     # asks for a date to open ("" unbinds it)

[fzf]
command = "fzf"
opts = []               # extra arguments for every fzf, e.g. ["--border", "--height=60%"]
preview = true          # show the note next to the list

# Romaji search through `ttyskk migemo`: in `find` and `grep`, a query
# starting with / is turned into a regex (/kaigi finds 会議). Off by itself
# when ttyskk is not installed.
[romaji]
enabled = true
command = "ttyskk"
# limit = 100              # passed as --limit
timeout = 5000             # milliseconds
headings = true            # `find` matches headings as well as paths
prefix = "/"               # starts a romaji query: one character; "" turns it off

# `links`, `orphans`, `dead-links`, `hubs`.
[graph]
depth = 2                  # how many links deep `links` goes
ignore_dirs = ["templates"]

# `recent`.
[recent]
limit = 50
ignore_dirs = ["templates"]

# The calendar, for `agenda`, {{agenda}} / {{agenda_week}} in templates and
# for the week digest. Read through gcalcli (set up and authenticated outside
# ttykasten), or any command that prints the same TSV.
[calendar]
enabled = false
# name = "Personal"         # --calendar; a string or a list
gcalcli = "gcalcli"
# command = "my-agenda {from} {to}"   # instead of gcalcli; {to} is exclusive
bullet = "- "
timeout = 15000             # milliseconds
[calendar.cache]
ttl = 900                   # seconds a result is reused
# dir = "~/.cache/ttykasten/calendar"
[calendar.keys]            # in `agenda` ("" unbinds one)
copy = "alt-i"              # copy the picked events' lines (tab marks several)
refresh = "ctrl-r"          # run the command again instead of reading the cache
[calendar.labels]
all_day = "all day"
unavailable = "calendar unavailable"

# `week` and `digest`.
[week]
ignore_dirs = ["templates"]
# Regexes on the path relative to home (the plugin's are Lua patterns).
ignore_patterns = []        # e.g. ['\.materials\.md$']
digest_key = "ctrl-d"       # in `week`, opens the week's digest ("" unbinds it)
[week.digest]
lines = 8                   # body lines quoted per note
tasks = true
calendar = true
ahead = 1                   # weeks to look ahead (0: none)
[week.digest.marks]
done = "✓"
open = "☐"
[week.digest.labels]
notes = "{} notes"
calendar = "Calendar"
finished = "Finished this week"
open = "Still open in this week's notes"
ahead = "Coming up"
due = "Due"
unavailable = "unavailable"
# Extra sections: a shell command run in home, with {from} {to} (the week)
# and {ahead_from} {ahead_to} replaced. Its output becomes the section.
# [[week.digest.sources]]
# label = "Mail"
# command = "mail-week {from} {to}"

# Colours are SGR parameters ("1;34" is bold blue). "" turns colouring off.
[preview.colors]
heading = "1;34"
tag = "36"
link = "4;34"
open = "33"
done = "32"
priority = "1;33"
due = "31"
dim = "2"
cancelled = "2;9"
mark = "7"              # the picked line in `link` and `backlinks`

# The menu shown when ttykasten runs with no arguments. Unset: every action,
# in the default order. Set: only the items written, in the order written.
#   action   a ttykasten action: daily weekly capture tasks inbox
#            capture-guided tag mint-ids undo week digest agenda find grep tags
#            recent new rename note log link link-daily insert-link backlinks links orphans
#            dead-links hubs
#   command  a shell command to run instead (sh -c, in home)
#   key      a hint shown in the list; `ttykasten <key>` also runs the item
#   label    the description; unset uses the language's default
#
# [menu]
# rest = true   # after your items, every action they leave out
#
# [[menu.items]]
# action = "daily"
# key = "kd"
#
# [[menu.items]]
# label = "git status"
# command = "git status; read -r _"
